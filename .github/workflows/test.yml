name: test

on:
  push:
    branches: [main]
  pull_request:
  # A new Streamlit release can change AppTest's behaviour with no change on our side (#151 came in
  # with 1.64), so the latest-stack job also runs weekly, not only on a push.
  schedule:
    - cron: "17 6 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: uv run --with pytest pytest -q

  # The locked versions above are what we develop against; this is what `pip install
  # streamlit-mcp` actually gives a user today: the newest streamlit/fastmcp our constraints
  # allow. CI only ever ran the lock (streamlit 1.58) while users got 1.65+, which is how the
  # st.form regression (#151) shipped unnoticed.
  test-latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - name: Install the package as a user would (latest allowed dependencies)
        run: |
          uv venv
          uv pip install . pytest
      - name: Show the resolved stack
        run: uv pip list | grep -Ei "^(streamlit|fastmcp|mcp) "
      - name: Run tests
        run: .venv/bin/python -m pytest -q
